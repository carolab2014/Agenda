<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9ff">
<title>Agenda V9</title>
<style>
:root{
  --bg:#f7f9ff; --text:#10131a; --panel:#fff; --shadow:0 10px 24px rgba(23,38,77,.18);
  --blue1:#8064df; --blue2:#466fd1; --blue3:#70b9ed; --blue4:#86d5c2; --blue5:#ffd65c;
  --line:rgba(55,50,100,.15); --field:#fff; --accent:#b786e8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body.dark{
  --bg:#0b1424; --text:#fff; --panel:#111d31; --field:#15233a;
  --line:rgba(255,255,255,.15); --shadow:0 12px 26px rgba(0,0,0,.38);
}
button,input,textarea{font:inherit}
button{color:inherit}
.page{display:none;min-height:100vh}
.page.active{display:block}
.top-actions{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.icon-btn{pointer-events:auto;border:2px solid rgba(255,255,255,.72);background:linear-gradient(145deg,#d8d8d8,#8f8f8f);color:#fff;width:44px;height:44px;border-radius:50%;box-shadow:0 5px 10px rgba(0,0,0,.22),inset 0 1px 2px rgba(255,255,255,.85);font-size:21px;font-weight:800;cursor:pointer}
.theme{display:flex;gap:8px;pointer-events:auto}
.theme button{border:2px solid rgba(255,255,255,.72);background:linear-gradient(145deg,#d8d8d8,#8f8f8f);color:#fff;width:44px;height:44px;border-radius:50%;box-shadow:0 5px 10px rgba(0,0,0,.22),inset 0 1px 2px rgba(255,255,255,.85);font-size:20px;cursor:pointer}
.theme button.on{outline:3px solid rgba(166,166,166,.30);outline-offset:3px}
.dashboard{padding:78px 28px 42px;max-width:1400px;margin:auto}
.title{text-align:center;font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(56px,7vw,92px);font-weight:800;text-shadow:0 5px 8px rgba(0,0,0,.18);margin:0 0 35px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.tile{border:0;border-radius:26px;min-height:150px;padding:22px 12px;box-shadow:0 12px 0 rgba(20,50,120,.16),var(--shadow);cursor:pointer;font-weight:800;font-size:clamp(17px,2vw,25px);transition:.15s transform; color:#111}
body.dark .tile{color:#fff}
.tile:active{transform:translateY(5px)}
.tile .ico{display:block;font-size:42px;margin-bottom:12px}
.c1{background:linear-gradient(145deg,#8f72e8,#c2a4f3)}
.c2{background:linear-gradient(145deg,#3159bd,#6794ed)}
.c3{background:linear-gradient(145deg,#78b9e9,#b7dcf8)}
.c4{background:linear-gradient(145deg,#82cfbd,#bce8db)}
.c5{background:linear-gradient(145deg,#ffd35c,#ffe99a)}
.placeholder{cursor:default}
.daily{padding:18px 22px 45px;max-width:1100px;margin:auto}
.daily-head{position:relative;padding:10px 80px 20px;text-align:center;background:linear-gradient(135deg,rgba(183,134,232,.48),rgba(235,222,250,.25));border-radius:0 0 28px 28px}
.daily-controls{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center}
.daily-theme{display:flex;gap:8px}
.silver-round{border:2px solid rgba(255,255,255,.72);background:linear-gradient(145deg,#d8d8d8,#8f8f8f);color:#fff;width:44px;height:44px;border-radius:50%;box-shadow:0 5px 10px rgba(0,0,0,.22),inset 0 1px 2px rgba(255,255,255,.85);font-size:20px;font-weight:800;cursor:pointer;display:grid;place-items:center;padding:0}
.silver-round.on{outline:3px solid rgba(166,166,166,.30);outline-offset:2px}
.daily h1{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(42px,6vw,72px);margin:0 0 6px;font-weight:800}
.date-row{display:grid;grid-template-columns:52px 1fr 52px;gap:14px;align-items:center;max-width:720px;margin:auto}
.nav{border:2px solid rgba(255,255,255,.72);background:linear-gradient(145deg,#d8d8d8,#8f8f8f);color:#fff;width:48px;height:48px;border-radius:50%;box-shadow:0 6px 12px rgba(0,0,0,.22),inset 0 1px 2px rgba(255,255,255,.85);font-size:31px;cursor:pointer;justify-self:center}
#dateLabel{font-size:clamp(20px,3vw,30px);font-weight:800}
.schedule{margin-top:18px}
.slot{display:grid;grid-template-columns:120px 1fr;gap:12px;margin:8px 0;align-items:start}
.time{background:linear-gradient(135deg,#e8d6fa,#d6b6f2);color:#111;text-align:center;font-weight:800;padding:13px 8px;border-radius:11px}
body.dark .time{background:linear-gradient(135deg,#62409a,#8c63bd);color:#fff}
.note{width:100%;min-height:48px;resize:none;overflow:hidden;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:11px;padding:13px 15px;outline:none;box-shadow:0 3px 8px rgba(0,0,0,.05)}
.note::placeholder{color:#8c8c98;font-style:italic}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:135px}}
@media(max-width:520px){
 .dashboard{padding:78px 15px 30px}.grid{grid-template-columns:1fr 1fr;gap:14px}.tile{min-height:112px;border-radius:20px;padding:14px 8px;font-size:15px}.tile .ico{font-size:31px}
 .daily{padding:12px 10px 35px}.daily-head{padding:64px 8px 16px}.slot{grid-template-columns:76px 1fr;gap:7px}.time{padding:13px 3px}.note{padding:13px 10px}
}
@media(orientation:landscape) and (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}

.sun-icon,.moon-icon{display:block;position:relative;width:20px;height:20px;margin:auto;color:#fff}
.sun-icon{border:2px solid currentColor;border-radius:50%;transform:scale(.62)}
.sun-icon::before{
 content:"";position:absolute;left:50%;top:50%;width:3px;height:34px;background:currentColor;
 transform:translate(-50%,-50%);border-radius:3px;
 box-shadow:0 0 0 transparent;
}
.sun-icon::after{
 content:"";position:absolute;left:50%;top:50%;width:34px;height:3px;background:currentColor;
 transform:translate(-50%,-50%);border-radius:3px;
 box-shadow:0 0 0 transparent;
}
.sun-icon{box-shadow:0 0 0 2px transparent}
.sun-icon + *{display:none}
.silver-round .sun-icon::before,.theme .sun-icon::before{
 box-shadow:none;
}
.moon-icon{width:20px;height:20px;border-radius:50%;background:#fff}
.moon-icon::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#aaa;left:7px;top:-3px}
.silver-round .moon-icon::after{background:#a7a7a7}
.theme .moon-icon::after{background:#a7a7a7}

/* diagonal rays for the sun */
.sun-icon{background:
 linear-gradient(#fff,#fff) center/2px 34px no-repeat,
 linear-gradient(90deg,#fff,#fff) center/34px 2px no-repeat;
}
.sun-icon::before{transform:translate(-50%,-50%) rotate(45deg)}
.sun-icon::after{transform:translate(-50%,-50%) rotate(45deg)}


.ui-svg{display:block;width:22px;height:22px;margin:auto;color:#fff}
.sun-svg{width:23px;height:23px}
.silver-round,.icon-btn,.theme button{
  -webkit-appearance:none;appearance:none;
  display:grid;place-items:center;padding:0;
}
.silver-round .ui-svg,.icon-btn .ui-svg,.theme button .ui-svg{pointer-events:none}


/* V3.3 — contrôles argent uniformes */
.silver-round,
.icon-btn,
.theme button{
  box-sizing:border-box !important;
  width:44px !important;
  height:44px !important;
  min-width:44px !important;
  min-height:44px !important;
  padding:0 !important;
  border:2px solid rgba(255,255,255,.88) !important;
  border-radius:50% !important;
  background:linear-gradient(145deg,#d7d7d7 0%,#a6a6a6 52%,#8f8f8f 100%) !important;
  color:#fff !important;
  box-shadow:0 4px 9px rgba(0,0,0,.22), inset 0 1px 1px rgba(255,255,255,.72) !important;
  outline:none !important;
  appearance:none !important;
  -webkit-appearance:none !important;
  display:grid !important;
  place-items:center !important;
}
.silver-round.on,
.icon-btn.on,
.theme button.on,
.silver-round:focus,
.icon-btn:focus,
.theme button:focus{
  outline:none !important;
  box-shadow:0 4px 9px rgba(0,0,0,.22), inset 0 1px 1px rgba(255,255,255,.72) !important;
}
.ui-svg{
  display:block !important;
  width:21px !important;
  height:21px !important;
  margin:0 !important;
  color:#fff !important;
  overflow:visible;
}
.sun-svg{width:22px !important;height:22px !important}

/* En-tête journalier stable en portrait et paysage */
.daily{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  overflow-x:hidden;
}
.daily-head{
  width:100%;
  min-width:0;
  overflow:hidden;
}
.daily-head h1{
  max-width:calc(100% - 150px);
  margin-left:auto;
  margin-right:auto;
  white-space:normal;
  overflow-wrap:normal;
  line-height:1.05;
}
.date-row{
  width:min(720px,100%);
  min-width:0;
}
#dateLabel{
  min-width:0;
  overflow-wrap:break-word;
}
.daily-controls{
  z-index:5;
}
@media(max-width:700px){
  .daily{padding-left:8px;padding-right:8px}
  .daily-head{padding:62px 12px 16px}
  .daily-head h1{
    max-width:100%;
    font-size:clamp(38px,11vw,58px);
  }
  .date-row{grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}
  #dateLabel{font-size:clamp(18px,5vw,25px)}
}


.tile .ico{display:flex;align-items:center;justify-content:center;height:50px;margin-bottom:10px}
.tile .ico svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
body:not(.dark) .tile .ico{color:#111}
body.dark .tile .ico{color:#fff}
@media(max-width:520px){.tile .ico{height:38px;margin-bottom:7px}.tile .ico svg{width:35px;height:35px}}

.grid .tile:nth-child(1){background:linear-gradient(135deg,#3020B8,#6B42D9) !important;}
.grid .tile:nth-child(2){background:linear-gradient(135deg,#4430C2,#7B4EDB) !important;}
.grid .tile:nth-child(3){background:linear-gradient(135deg,#5B3BC7,#9259D8) !important;}
.grid .tile:nth-child(4){background:linear-gradient(135deg,#7048C8,#A765D4) !important;}
.grid .tile:nth-child(5){background:linear-gradient(135deg,#A817C2,#D838B0) !important;}
.grid .tile:nth-child(6){background:linear-gradient(135deg,#C31AA9,#E7469A) !important;}
.grid .tile:nth-child(7){background:linear-gradient(135deg,#D71B91,#F04B83) !important;}

.grid .tile{color:#fff !important;text-shadow:0 1px 2px rgba(0,0,0,.22)}
.grid .tile .ico{color:#fff !important}
.grid .tile .ico svg{stroke:#fff !important}
.grid .tile .ico svg text{fill:#fff !important;stroke:none !important}
.agenda-flourish{display:flex;justify-content:center;align-items:center;margin:-8px auto 24px;color:var(--text);height:28px}
.agenda-flourish svg{width:250px;max-width:55vw;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}


/* V3.7 — Agenda journalier assorti exactement à la case JOUR */
.daily-head {
  background:linear-gradient(135deg,#3020B8 0%,#6B42D9 100%) !important;
  border-radius:30px !important;
  color:#fff !important;
  margin-top:12px;
  box-shadow:0 8px 18px rgba(48,32,184,.18);
}
.daily-head h1,
.daily-head #dateLabel {
  color:#fff !important;
}
.daily-head .silver-round {
  color:#fff !important;
}
.time {
  background:linear-gradient(135deg,#3020B8 0%,#6B42D9 100%) !important;
  color:#fff !important;
  box-shadow:0 4px 9px rgba(48,32,184,.16);
}
body.dark .daily-head {
  background:linear-gradient(135deg,#3020B8 0%,#6B42D9 100%) !important;
}
body.dark .time {
  background:linear-gradient(135deg,#3020B8 0%,#6B42D9 100%) !important;
  color:#fff !important;
}


/* V3.8 — règle globale texte/icônes */
body:not(.dark),
body:not(.dark) button,
body:not(.dark) input,
body:not(.dark) textarea,
body:not(.dark) .tile,
body:not(.dark) .tile .ico,
body:not(.dark) .daily-head,
body:not(.dark) .daily-head h1,
body:not(.dark) .daily-head #dateLabel,
body:not(.dark) .time {
  color:#000 !important;
  -webkit-text-fill-color:#000 !important;
}

body:not(.dark) .tile .ico svg,
body:not(.dark) .daily-head svg {
  color:#000 !important;
  stroke:#000 !important;
}
body:not(.dark) .tile .ico svg text {
  fill:#000 !important;
  stroke:none !important;
}

body.dark,
body.dark button,
body.dark input,
body.dark textarea,
body.dark .tile,
body.dark .tile .ico,
body.dark .daily-head,
body.dark .daily-head h1,
body.dark .daily-head #dateLabel,
body.dark .time {
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
}

body.dark .tile .ico svg,
body.dark .daily-head svg {
  color:#fff !important;
  stroke:#fff !important;
}
body.dark .tile .ico svg text {
  fill:#fff !important;
  stroke:none !important;
}

/* Les boutons argent conservent toujours leurs pictogrammes blancs. */
.silver-round,
.silver-round .ui-svg,
.theme button,
.theme button .ui-svg,
body:not(.dark) .silver-round,
body:not(.dark) .silver-round .ui-svg,
body:not(.dark) .theme button,
body:not(.dark) .theme button .ui-svg,
body.dark .silver-round,
body.dark .silver-round .ui-svg,
body.dark .theme button,
body.dark .theme button .ui-svg {
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
}
.silver-round svg,
.theme button svg,
body:not(.dark) .silver-round svg,
body:not(.dark) .theme button svg,
body.dark .silver-round svg,
body.dark .theme button svg {
  stroke:#fff !important;
}

/* Placeholder lisible selon le mode */
body:not(.dark) textarea::placeholder,
body:not(.dark) input::placeholder {
  color:#777 !important;
  -webkit-text-fill-color:#777 !important;
}
body.dark textarea::placeholder,
body.dark input::placeholder {
  color:#aaa !important;
  -webkit-text-fill-color:#aaa !important;
}


/* V3.9 — contraste permanent */
body:not(.dark) .daily-head h1,
body:not(.dark) .daily-head #dateLabel,
body:not(.dark) .time,
body:not(.dark) .note {
  color:#000 !important;
  -webkit-text-fill-color:#000 !important;
}
body.dark .daily-head h1,
body.dark .daily-head #dateLabel,
body.dark .time,
body.dark .note {
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
}
body:not(.dark) .note::placeholder {
  color:#777 !important;
  -webkit-text-fill-color:#777 !important;
}
body.dark .note::placeholder {
  color:#aaa !important;
  -webkit-text-fill-color:#aaa !important;
}


/* ===== V4.1 : PAGE SEMAINE ===== */
.week-page{display:none;max-width:1400px;margin:0 auto;padding:12px 18px 34px}
.week-page.active{display:block}
.week-head{
  position:relative;
  min-height:205px;
  padding:22px 105px 24px;
  border-radius:30px;
  background:linear-gradient(135deg,#4430C2 0%,#7B4EDB 100%);
  box-shadow:0 9px 20px rgba(68,48,194,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.week-title{
  margin:0;
  font-family:"Snell Roundhand","Apple Chancery","URW Chancery L",cursive;
  font-size:clamp(46px,6vw,82px);font-weight:700;line-height:.95;
}
.week-range{font-size:clamp(22px,3vw,35px);font-weight:800;margin-top:16px;text-align:center}
.week-home{position:absolute;left:20px;top:18px}
.week-theme{position:absolute;right:20px;top:18px;display:flex;gap:10px}
.week-prev{position:absolute;left:18%;bottom:20px}
.week-next{position:absolute;right:18%;bottom:20px}
.week-table-wrap{margin-top:22px;overflow-x:auto;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.week-table{width:100%;min-width:980px;border-collapse:separate;border-spacing:0;table-layout:fixed}
.week-table th,.week-table td{border-right:1px solid rgba(68,48,194,.22);border-bottom:1px solid rgba(68,48,194,.22)}
.week-table thead th{
  background:linear-gradient(135deg,#4430C2,#7B4EDB);
  padding:13px 6px;font-weight:800;font-size:15px;
}
.week-table .hour{width:90px;background:linear-gradient(135deg,#4430C2,#7B4EDB);font-weight:800;text-align:center}
.week-cell{height:43px;padding:0;background:rgba(123,78,219,.045)}
.week-table tbody tr:nth-child(even) .week-cell{background:rgba(123,78,219,.10)}
.week-cell textarea{
  width:100%;height:100%;min-height:43px;box-sizing:border-box;border:0;outline:0;resize:none;
  background:transparent;padding:7px 8px;font:inherit;overflow:hidden;
}
body:not(.dark) .week-head,
body:not(.dark) .week-head *,
body:not(.dark) .week-table th,
body:not(.dark) .week-table .hour,
body:not(.dark) .week-cell textarea{
  color:#000 !important;-webkit-text-fill-color:#000 !important;
}
body.dark .week-head,
body.dark .week-head *,
body.dark .week-table th,
body.dark .week-table .hour,
body.dark .week-cell textarea{
  color:#fff !important;-webkit-text-fill-color:#fff !important;
}
body.dark .week-cell{background:rgba(123,78,219,.10)}
body.dark .week-table tbody tr:nth-child(even) .week-cell{background:rgba(123,78,219,.18)}
body.dark .week-table th,.week-table td{border-color:rgba(180,160,255,.22)}
/* Silver buttons: same construction as the daily page */
.week-head .silver-round{
  background:linear-gradient(145deg,#eeeeee 0%,#c8c8c8 48%,#a9a9a9 100%) !important;
  border:2px solid rgba(255,255,255,.95) !important;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.85),inset 0 -3px 5px rgba(90,90,90,.18),0 5px 10px rgba(0,0,0,.20) !important;
  color:#fff !important;-webkit-text-fill-color:#fff !important;
}
.week-head .silver-round svg{stroke:#fff !important}
.week-prev,.week-next{font-size:34px;font-weight:700}
@media(max-width:700px){
 .week-page{padding:8px 8px 25px}
 .week-head{min-height:185px;padding:20px 70px 22px}
 .week-home{left:12px;top:12px}.week-theme{right:12px;top:12px;gap:6px}
 .week-prev{left:14%;bottom:16px}.week-next{right:14%;bottom:16px}
}


/* V4.3 — pictogrammes des boutons argent selon le mode */
/* Mode clair : maison, soleil et lune noirs */
body:not(.dark) .silver-round,
body:not(.dark) .theme button,
body:not(.dark) .icon-btn {
  color:#000 !important;
  -webkit-text-fill-color:#000 !important;
}
body:not(.dark) .silver-round svg,
body:not(.dark) .theme button svg,
body:not(.dark) .icon-btn svg,
body:not(.dark) .silver-round .ui-svg,
body:not(.dark) .theme button .ui-svg,
body:not(.dark) .icon-btn .ui-svg {
  color:#000 !important;
  stroke:#000 !important;
}
body:not(.dark) .sun-icon::before,
body:not(.dark) .moon-icon::before {
  color:#000 !important;
}

/* Mode sombre : maison, soleil et lune blancs */
body.dark .silver-round,
body.dark .theme button,
body.dark .icon-btn {
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
}
body.dark .silver-round svg,
body.dark .theme button svg,
body.dark .icon-btn svg,
body.dark .silver-round .ui-svg,
body.dark .theme button .ui-svg,
body.dark .icon-btn .ui-svg {
  color:#fff !important;
  stroke:#fff !important;
}
body.dark .sun-icon::before,

}

<script>
const home=document.getElementById('home'), daily=document.getElementById('daily'), homeBtn=document.getElementById('homeBtn');
const lightBtn=document.getElementById('lightBtn'), darkBtn=document.getElementById('darkBtn');
function setTheme(mode){
 document.body.classList.toggle('dark',mode==='dark');
 lightBtn.classList.toggle('on',mode==='light'); darkBtn.classList.toggle('on',mode==='dark');
 const dl=document.getElementById('dailyLight'), dd=document.getElementById('dailyDark');
 if(dl) dl.classList.toggle('on',mode==='light');
 if(dd) dd.classList.toggle('on',mode==='dark');
 localStorage.setItem('agenda-theme',mode);
}
lightBtn.onclick=()=>setTheme('light'); darkBtn.onclick=()=>setTheme('dark');
setTheme(localStorage.getItem('agenda-theme')||'light');

function show(page){
 const wp=document.getElementById('weekPage');
 if(wp){wp.classList.remove('active');wp.style.display='none';}
 home.style.display=''; daily.style.display='';
 home.classList.toggle('active',page==='home'); daily.classList.toggle('active',page==='daily');
 homeBtn.style.visibility='hidden';
 document.querySelector('.top-actions').style.display=page==='daily'?'none':'flex';
 window.scrollTo(0,0);
}
homeBtn.onclick=()=>show('home');
document.getElementById('dailyHome').onclick=()=>show('home');
document.getElementById('dailyLight').onclick=()=>setTheme('light');
document.getElementById('dailyDark').onclick=()=>setTheme('dark');
document.querySelector('[data-page="daily"]').onclick=()=>show('daily');

const START = new Date(2026,7,1); // 1 septembre 2026
let current = new Date(Math.max(Date.now(), START.getTime()));
current.setHours(12,0,0,0);

function keyForDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(d){return d.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
const schedule=document.getElementById('schedule');
function times(){
 const a=[];
 for(let h=5;h<24;h++){
   a.push(`${h}:00`);
   a.push(`${h}:30`);
 }
 a.push('24:00');
 return a;
}
function autoGrow(el){
 el.style.height='0px';
 el.style.height=Math.max(48,el.scrollHeight)+'px';
}
function resizeAllNotes(){
 document.querySelectorAll('.note').forEach(autoGrow);
}
window.addEventListener('resize',()=>requestAnimationFrame(resizeAllNotes));
window.addEventListener('orientationchange',()=>setTimeout(resizeAllNotes,120));
function render(){
 document.getElementById('dateLabel').textContent=formatDate(current);
 schedule.innerHTML='';
 const dk=keyForDate(current);
 times().forEach(t=>{
  const row=document.createElement('div'); row.className='slot';
  const lab=document.createElement('div'); lab.className='time'; lab.textContent=t;
  const ta=document.createElement('textarea'); ta.className='note'; ta.placeholder='Écrire ici...';
  const storageKey=`agenda:${dk}:${t}`; ta.value=localStorage.getItem(storageKey)||'';
  ta.addEventListener('input',()=>{autoGrow(ta);localStorage.setItem(storageKey,ta.value); if(typeof agendaV5FillWeekSummaries==='function') agendaV5FillWeekSummaries();});
  row.append(lab,ta); schedule.append(row); requestAnimationFrame(()=>autoGrow(ta));
 });
 document.getElementById('prevDay').disabled=current<=START;
}
document.getElementById('prevDay').onclick=()=>{if(current>START){current.setDate(current.getDate()-1);render()}};
document.getElementById('nextDay').onclick=()=>{current.setDate(current.getDate()+1);render()};
setTheme(localStorage.getItem('agenda-theme')||'light');
render();
</script>

<script>
(function(){
 const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
 const DAYS=["DIM","LUN","MAR","MER","JEU","VEN","SAM"];
 function currentSunday(){
   const now=new Date();
   const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
   d.setDate(d.getDate()-d.getDay());
   return d;
 }
 let weekStart=currentSunday(); window.agendaWeekStart=weekStart;

 function pad(n){return String(n).padStart(2,"0")}
 function key(d,h){return "agenda-week-"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"-"+h.replace(":","")}
 function fmtRange(a,b){
   if(a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear())
     return `Semaine du ${a.getDate()} au ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
   return `Semaine du ${a.getDate()} ${MONTHS[a.getMonth()]} au ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
 }
 function autoGrow(t){t.style.height="43px";t.style.height=Math.max(43,t.scrollHeight)+"px"}
 window.renderWeek=function(){
   const end=new Date(weekStart); end.setDate(end.getDate()+6);
   document.getElementById("weekRange").textContent=fmtRange(weekStart,end);
   const hr=document.getElementById("weekDaysHead"); hr.innerHTML="<th>HEURE</th>";
   const dates=[];
   for(let i=0;i<7;i++){
     const d=new Date(weekStart); d.setDate(d.getDate()+i); dates.push(d);
     hr.insertAdjacentHTML("beforeend",`<th>${DAYS[i]} ${d.getDate()} ${MONTHS[d.getMonth()].toUpperCase()}</th>`);
   }
   const tb=document.getElementById("weekBody"); tb.innerHTML="";
   const slots=[]; for(let h=5;h<24;h++){slots.push(`${h}:00`,`${h}:30`)} slots.push("24:00");
   slots.forEach(h=>{
     const tr=document.createElement("tr");
     tr.innerHTML=`<td class="hour">${h}</td>`;
     dates.forEach(d=>{
       const td=document.createElement("td"); td.className="week-cell";
       const ta=document.createElement("textarea"); ta.setAttribute("aria-label",`${h} ${DAYS[d.getDay()]}`);
       ta.value=localStorage.getItem(key(d,h))||"";
       ta.addEventListener("input",()=>{localStorage.setItem(key(d,h),ta.value);autoGrow(ta)});
       td.appendChild(ta); tr.appendChild(td); setTimeout(()=>autoGrow(ta),0);
     });
     tb.appendChild(tr);
   });
 }
 window.changeWeek=function(days){weekStart.setDate(weekStart.getDate()+days);window.agendaWeekStart=weekStart;renderWeek()}

 window.showHome=function(){
   const p=document.getElementById('weekPage');
   p.classList.remove('active');
   p.style.display='none';
   const home=document.getElementById('home');
   const daily=document.getElementById('daily');
   home.style.display='';
   daily.style.display='';
   home.classList.add('active');
   daily.classList.remove('active');
   document.querySelector('.top-actions').style.display='flex';
   document.getElementById('homeBtn').style.visibility='hidden';
   window.scrollTo(0,0);
 }

 window.showWeek=function(){
   // V8 : chaque ouverture de la page Semaine revient automatiquement à la semaine en cours.
   weekStart=currentSunday();
   window.agendaWeekStart=weekStart;
   document.getElementById('home').classList.remove('active');
   document.getElementById('daily').classList.remove('active');
   document.getElementById('home').style.display='none';
   document.getElementById('daily').style.display='none';
   document.querySelector('.top-actions').style.display='none';
   const p=document.getElementById('weekPage');
   p.style.display='block';
   p.classList.add('active');
   renderWeek();
   window.scrollTo(0,0);
 }
 // Wire the SEMAINe tile without changing the rest of the application.
 document.addEventListener("DOMContentLoaded",()=>{
   const buttons=[...document.querySelectorAll("button.tile")];
   const b=buttons.find(x=>x.textContent.trim().toUpperCase().includes("SEMAINE"));
   if(b){b.onclick=function(e){e.preventDefault();showWeek()}}
 });
})();

/* ===== Agenda V5 : résumé Jour -> Semaine avec [crochets] ===== */
function agendaV5ExtractItems(text){
  const source = String(text || '');
  const found = [];
  const occupied = [];

  // V9 corrigée : [[...]] forme UN sujet.
  // Si le groupe contient des [mots] internes, seuls ces mots sont réunis.
  // Exemple : [[Retour] au [travail] pour [Caro]] -> Retour travail Caro
  const grouped = /\[\[([\s\S]*?)\]\]/g;
  let m;
  while ((m = grouped.exec(source)) !== null) {
    const inside = m[1];
    const selected = [];
    // Le dernier ] d'un mot peut aussi servir de 1er ] de fermeture du groupe [[...]].
    // On ajoute donc virtuellement un ] pour que [Caro]] soit lu comme le mot Caro
    // puis comme la fermeture du groupe.
    const innerSource = inside + ']';
    const inner = /\[([^\[\]]+?)\]/g;
    let im;
    while ((im = inner.exec(innerSource)) !== null) {
      const v = String(im[1] || '').trim();
      if (v) selected.push(v);
    }
    const value = selected.length
      ? selected.join(' ')
      : inside.replace(/[\[\]]/g, '').trim();
    if (value) found.push({pos:m.index, value});
    occupied.push([m.index, m.index + m[0].length]);
  }

  // Les [éléments] simples qui ne sont pas à l'intérieur d'un [[groupe]].
  const single = /\[([^\[\]]+?)\]/g;
  while ((m = single.exec(source)) !== null) {
    const pos = m.index;
    if (occupied.some(r => pos >= r[0] && pos < r[1])) continue;
    const value = String(m[1] || '').trim();
    if (value) found.push({pos, value});
  }

  return found.sort((a,b)=>a.pos-b.pos).map(x=>x.value);
}
function agendaV5ExtractWeeklySummary(text){
  return agendaV5ExtractItems(text).join(' • ');
}

function agendaV5DateKey(date){
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,'0'),
    String(date.getDate()).padStart(2,'0')
  ].join('-');
}

function agendaV5ReadDailyText(date, time){
  const dateKey = agendaV5DateKey(date);
  return localStorage.getItem(`agenda:${dateKey}:${time}`) || '';
}

function agendaV5FillWeekSummaries(){
  const rows = [...document.querySelectorAll('#weekBody tr')];
  if (!rows.length || !window.agendaWeekStart) return;

  rows.forEach(row => {
    const cells = [...row.children];
    if (cells.length < 8) return;
    const time = (cells[0].textContent || '').trim();
    if (!/^\d{1,2}:\d{2}$/.test(time)) return;

    for (let d=0; d<7; d++){
      const date = new Date(window.agendaWeekStart);
      date.setDate(window.agendaWeekStart.getDate()+d);

      const dailyText = agendaV5ReadDailyText(date, time);
      const summary = agendaV5ExtractWeeklySummary(dailyText);
      const ta = cells[d+1].querySelector('textarea');
      if (!ta) continue;

      // If Day contains [brackets], the Week cell shows only that extracted text.
      // If there are no brackets, retain any manually-entered Week text.
      if (summary) {
        ta.value = summary;
        ta.dataset.fromDay = '1';
      } else if (ta.dataset.fromDay === '1') {
        ta.value = '';
        delete ta.dataset.fromDay;
      }
      if (typeof autoGrow === 'function') autoGrow(ta);
    }
  });
}

/* Après chaque rendu de semaine, injecter les résumés entre crochets. */
if (typeof renderWeek === 'function'){
  const agendaV5OriginalRenderWeek = renderWeek;
  renderWeek = function(){
    const result = agendaV5OriginalRenderWeek.apply(this, arguments);
    setTimeout(agendaV5FillWeekSummaries, 0);
    return result;
  };
}

/* Mise à jour immédiate si un texte quotidien est modifié pendant que la
   semaine existe dans le DOM. */
document.addEventListener('input', function(e){
  if (e.target && e.target.matches('textarea, input[type="text"]')){
    setTimeout(agendaV5FillWeekSummaries, 0);
  }
});

</script>

/* ===== Agenda V6 — calendrier mensuel + synchronisation [crochets] ===== */
(function(){
 const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
 const D=["DIM","LUN","MAR","MER","JEU","VEN","SAM"];

 function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
 function extract(s){return (typeof agendaV5ExtractItems==='function'?agendaV5ExtractItems(s):[])}
 function dailyEntries(d){
   const dk=dateKey(d), out=[];
   times().forEach(t=>{
     const parts=extract(localStorage.getItem(`agenda:${dk}:${t}`)||'');

 function bracketSummary(date){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.includes(key(date))){const v=localStorage.getItem(k)||'';const parts=(typeof agendaV5ExtractItems==='function'?agendaV5ExtractItems(v):[]);parts.forEach(x=>out.push(x))}}}catch(e){} return [...new Set(out)].join(' · ')}
 function render(){document.getElementById('yearLabel').textContent=y; const root=document.getElementById('yearColumns');root.innerHTML='';const now=new Date();
  months.forEach((mn,m)=>{const box=document.createElement('div');box.className='year-month';box.innerHTML=`<div class="year-month-title">${mn}<br>${y}</div>`;const mini=document.createElement('div');mini.className='year-mini';mini.innerHTML='<div class="year-mini-week">'+wd.map(x=>`<span>${x}</span>`).join('')+'</div>';const mg=document.createElement('div');mg.className='year-mini-grid';let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let z=0;z<first;z++){let e=document.createElement('span');e.className='year-mini-day empty';mg.appendChild(e)}for(let d=1;d<=days;d++){let dt=new Date(y,m,d),e=document.createElement('span');e.className='year-mini-day'+([0,6].includes(dt.getDay())?' weekend':'')+(dt.toDateString()==now.toDateString()?' today':'');e.textContent=d;mg.appendChild(e)}mini.appendChild(mg);box.appendChild(mini);const rows=document.createElement('div');rows.className='year-days';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),r=document.createElement('div');r.className='year-row'+([0,6].includes(dt.getDay())?' weekend':'')+(dt.toDateString()==now.toDateString()?' today':'');r.innerHTML=`<span>${d}</span><span>${wd[dt.getDay()]}</span><span class="year-note">${bracketSummary(dt)}</span>`;rows.appendChild(r)}box.appendChild(rows);root.appendChild(box)})}
 window.showYear=()=>{['home','daily','weekPage','monthPage'].forEach(id=>{let e=document.getElementById(id);if(e){e.classList.remove('active');e.style.display='none'}});document.querySelector('.top-actions').style.display='none';let p=document.getElementById('yearPage');p.style.display='block';p.classList.add('active');render();window.scrollTo(0,0)};
 window.yearGoHome=()=>{let p=document.getElementById('yearPage');p.classList.remove('active');p.style.display='none';let h=document.getElementById('home');h.style.display='block';h.classList.add('active');document.querySelector('.top-actions').style.display='flex';window.scrollTo(0,0)};
 window.changeYear=n=>{y+=n;render()}; const slider=document.getElementById('yearSize'),val=document.getElementById('yearSizeValue');function size(v){v=Math.max(18,Math.min(46,+v));slider.value=v;val.textContent=v;document.documentElement.style.setProperty('--year-row-h',v+'px');localStorage.setItem('agenda-year-row-size',v)}slider.oninput=()=>size(slider.value);document.getElementById('yearSmaller').onclick=()=>size(+slider.value-2);document.getElementById('yearLarger').onclick=()=>size(+slider.value+2);size(localStorage.getItem('agenda-year-row-size')||22);
 const tile=document.querySelector('[data-page="year"]');if(tile)tile.onclick=e=>{e.preventDefault();showYear()};
})();
</script>
